<!DOCTYPE html>
<html lang="ar" dir="rtl" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Quality</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070809;--card:#0f1318;--s2:#131820;--brd:#1e2530;--txt:#e2e8f0;--txt2:#8899aa;--txt3:#5b6675;--acc:#f97316}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
body.lang-ur{font-family:'Noto Nastaliq Urdu','Cairo',sans-serif}
body.lang-bn{font-family:'Noto Sans Bengali','Cairo',sans-serif}
.header{width:100%;background:var(--card);border-bottom:1px solid var(--brd);padding:14px 24px;display:flex;align-items:center;gap:12px}
.header-title{font-size:17px;font-weight:900;color:var(--acc)}
.header-sub{font-size:11px;color:var(--txt3)}
.lang-bar{margin-right:auto;display:flex;gap:6px}
.lang-btn{background:var(--s2);border:1px solid var(--brd);border-radius:7px;color:var(--txt2);font-size:11px;font-weight:700;padding:4px 10px;cursor:pointer;transition:.15s}
.lang-btn:hover{color:var(--txt);border-color:var(--txt3)}
.lang-btn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.search-wrap{margin-top:70px;text-align:center;width:100%;max-width:460px;padding:0 20px}
.search-icon{font-size:44px;margin-bottom:14px}
.search-title{font-size:19px;font-weight:900;margin-bottom:5px}
.search-hint{font-size:12px;color:var(--txt3);margin-bottom:24px}
.search-row{display:flex;gap:10px}
.search-input{flex:1;background:var(--card);border:1.5px solid var(--brd);border-radius:10px;padding:13px 16px;color:var(--txt);font-family:inherit;font-size:16px;outline:none;transition:.2s;text-align:center;letter-spacing:2px}
.search-input:focus{border-color:var(--acc)}
.search-btn{padding:13px 22px;background:linear-gradient(135deg,#f97316,#ea580c);border:none;border-radius:10px;color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.search-btn:hover{opacity:.88}
.search-err{margin-top:12px;color:#ef4444;font-size:13px;min-height:18px}
.result-wrap{width:100%;max-width:640px;padding:20px;display:none}
.back-btn{background:var(--s2);border:1px solid var(--brd);border-radius:8px;color:var(--txt2);font-family:inherit;font-size:13px;padding:7px 16px;cursor:pointer;margin-bottom:16px}
.back-btn:hover{color:var(--txt)}
.rider-card{background:var(--card);border:1px solid var(--brd);border-radius:16px;overflow:hidden}
.rider-head{padding:18px 22px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rider-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.rider-name{font-size:16px;font-weight:900}
.rider-meta{font-size:11px;color:var(--txt2);margin-top:3px}
.badges{display:flex;gap:6px;align-items:center;margin-right:auto;flex-wrap:wrap}
[dir="ltr"] .badges{margin-right:unset;margin-left:auto}
.seg-badge{display:inline-flex;align-items:center;justify-content:center;padding:3px 12px;border-radius:20px;font-weight:900;font-size:13px}
.seg-A{background:#10b98122;color:#10b981;border:1px solid #10b98140}
.seg-B{background:#3b82f622;color:#3b82f6;border:1px solid #3b82f640}
.seg-C{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b40}
.seg-D{background:#f9731622;color:#f97316;border:1px solid #f9731640}
.seg-E{background:#ef444422;color:#ef4444;border:1px solid #ef444440}
.seg-F{background:#7c3aed22;color:#a855f7;border:1px solid #a855f740}
.pb{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:700}
.pb-hunger{background:#f9731618;color:#f97316;border:1px solid #f9731640}
.pb-masar{background:#3b82f618;color:#3b82f6;border:1px solid #3b82f640}
.status-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:700}
.st-ach{background:#10b98118;color:#10b981;border:1px solid #10b98140}
.st-not{background:#ef444418;color:#ef4444;border:1px solid #ef444440}
.sec-title{padding:12px 22px 6px;font-size:10px;color:var(--txt3);letter-spacing:1.5px;border-top:1px solid var(--brd)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--brd)}
.metric{background:var(--card);padding:14px 12px;text-align:center}
.metric-val{font-size:20px;font-weight:900;margin-bottom:2px}
.metric-lbl{font-size:10px;color:var(--txt3);line-height:1.3}
.metric-sub{font-size:11px;color:var(--txt2);margin-top:2px}
.score-hi{color:#10b981}
.score-md{color:#f59e0b}
.score-lo{color:#ef4444}
.final-bar{padding:18px 22px;border-top:1px solid var(--brd)}
.final-lbl{font-size:10px;color:var(--txt3);letter-spacing:1px;margin-bottom:8px}
.bar-bg{background:var(--s2);border-radius:6px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.final-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
</style>
</head>
<body>

<div class="header">
  <span style="font-size:22px">&#128230;</span>
  <div>

  <div class="lang-bar">

</div>

<div class="search-wrap" id="search-wrap">
  <div class="search-icon">&#128269;</div>
  <div class="search-title" id="t-search-title"></div>
  <div class="search-hint" id="t-search-hint"></div>
  <div class="search-row">
    <input class="search-input" id="rid-input" type="number" autocomplete="off"/>
    <button class="search-btn" id="t-search-btn" onclick="doSearch()"></button>
  </div>
  <div class="search-err" id="search-err"></div>
</div>

<div class="result-wrap" id="result-wrap">

</div>

var curLang = 'ar';
var curDriver = null;

function t(key){ return T[curLang][key]||key; }

function setLang(lang){
  curLang = lang;
  var L = T[lang];
  document.getElementById('root').setAttribute('lang', L.lang);
  document.getElementById('root').setAttribute('dir', L.dir);
  document.body.className = 'lang-'+lang;
  document.querySelectorAll('.lang-btn').forEach(function(b,i){
    b.classList.toggle('active', ['ar','en','ur','bn'][i]===lang);
  });
  applyTranslations();
  if(curDriver) showResult(curDriver);
}

function applyTranslations(){
  document.getElementById('t-header-sub').textContent = t('header-sub');
  document.getElementById('t-search-title').textContent = t('search-title');
  document.getElementById('t-search-hint').textContent = t('search-hint');
  document.getElementById('rid-input').placeholder = t('search-placeholder');
  document.getElementById('t-search-btn').textContent = t('search-btn');
  document.getElementById('t-back-btn').textContent = t('back-btn');
  document.getElementById('search-err').textContent = '';
}

function sc(v){return v>=95?'score-hi':v>=85?'score-md':'score-lo';}
function sh(v){return v>=95?'#10b981':v>=85?'#f59e0b':'#ef4444';}
function fmt(v){return v!==null&&v!==undefined?v:'—';}

function doSearch(){
  var raw=document.getElementById('rid-input').value.trim();
  var err=document.getElementById('search-err');
  err.textContent='';
  if(!raw){err.textContent=t('err-empty');return;}
  var rid=parseInt(raw);
  var d=null;
  for(var i=0;i<ALL.length;i++){if(ALL[i].id===rid){d=ALL[i];break;}}
  if(!d){err.textContent=t('err-notfound');return;}
  curDriver=d;
  showResult(d);
}

function showResult(d){
  var col=SEG_COL[d.segment]||'#94a3b8';
  var initials='';
  if(d.name&&isNaN(d.name.charAt(0))){
    initials=d.name.split(' ').slice(0,2).map(function(w){return w.charAt(0);}).join('').toUpperCase();
  } else { initials=String(d.id).slice(-2); }
  var isHun=d.platform==='hunger';
  var stText=d.status==='محقق'?t('st-ach'):t('st-not');
  var stClass=d.status==='محقق'?'st-ach':'st-not';
  var statusBadge=d.status?('<span class="status-badge '+stClass+'">'+stText+'</span>'):'';
  var ar=d.acceptance_rate!==null&&d.acceptance_rate!==undefined?d.acceptance_rate+'%':'—';
  var ar_class=d.acceptance_rate>=99?'score-hi':d.acceptance_rate>=95?'score-md':'score-lo';
  var failed_col=d.failed_by_rider>0?'#ef4444':'#64748b';
  var delay=d.completed_dq-d.in_time;
  var delay_col=delay>0?'#f59e0b':'#64748b';

  document.getElementById('rider-card').innerHTML=
    '<div class="rider-head">'+
      '<div class="rider-avatar" style="background:'+col+'22;color:'+col+';border:2px solid '+col+'44">'+initials+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="rider-name">'+d.name+'</div>'+
        '<div class="rider-meta">ID: '+d.id+'&nbsp;&bull;&nbsp;'+d.city+(d.supervisor?'&nbsp;&bull;&nbsp;'+d.supervisor:'')+'</div>'+
      '</div>'+
      '<div class="badges">'+
        '<span class="seg-badge seg-'+d.segment+'">'+d.segment+'</span>'+
        '<span class="pb '+(isHun?'pb-hunger':'pb-masar')+'">'+t(isHun?'hunger':'masar')+'</span>'+
        statusBadge+
      '</div>'+
    '</div>'+

    '<div class="sec-title">'+t('sec-dq')+'</div>'+
    '<div class="metrics" style="border-top:none">'+
      '<div class="metric">'+
        '<div class="metric-val" style="color:var(--txt2)">'+fmt(d.total_ver)+'</div>'+
        '<div class="metric-lbl">'+t('total-ver')+'</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="metric-val" style="color:var(--txt2)">'+fmt(d.succ_ver)+'</div>'+
        '<div class="metric-lbl">'+t('succ-ver')+'</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="metric-val '+sc(d.ver_rate)+'">'+fmt(d.ver_rate)+'%</div>'+
        '<div class="metric-lbl">'+t('ver-rate')+'</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="metric-val" style="color:#10b981">'+fmt(d.in_time)+'</div>'+
        '<div class="metric-lbl">'+t('in-time')+'</div>'+
        '<div class="metric-sub">'+t('in-time-sub')+' '+d.completed_dq+'</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="metric-val '+sc(d.ontime_score)+'">'+fmt(d.ontime_score)+'%</div>'+
        '<div class="metric-lbl">'+t('ontime-score')+'</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="metric-val '+sc(d.fail_score)+'">'+fmt(d.fail_score)+'%</div>'+
        '<div class="metric-lbl">'+t('fail-score')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="metrics" style="border-top:1px solid var(--brd)">'+
      '<div class="metric">'+
        '<div class="metric-val" style="color:'+failed_col+'">'+fmt(d.failed_by_rider)+'</div>'+
        '<div class="metric-lbl">'+t('failed-by-rider')+'</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="metric-val" style="color:'+delay_col+'">'+delay+'</div>'+
        '<div class="metric-lbl">'+t('delay')+'</div>'+
      '</div>'+
      '<div class="metric">'+
        '<div class="metric-val '+ar_class+'">'+ar+'</div>'+
        '<div class="metric-lbl">'+t('acceptance')+'</div>'+
      '</div>'+
    '</div>'+

    '<div class="final-bar">'+
      '<div class="final-lbl">'+t('final-lbl')+'</div>'+
      '<div class="bar-bg"><div class="bar-fill" style="width:'+d.final_score+'%;background:'+sh(d.final_score)+'"></div></div>'+
      '<div class="final-row">'+
        '<span class="'+sc(d.final_score)+'" style="font-size:22px;font-weight:900">'+fmt(d.final_score)+'%</span>'+
        '<span style="color:var(--txt3);font-size:11px">'+t('seg-lbl')+': <strong style="color:'+col+'">'+d.segment+'</strong></span>'+
      '</div>'+
    '</div>';

  document.getElementById('search-wrap').style.display='none';
  document.getElementById('result-wrap').style.display='block';
}

function goBack(){
  curDriver=null;
  document.getElementById('search-wrap').style.display='';
  document.getElementById('result-wrap').style.display='none';
  document.getElementById('rid-input').value='';
  document.getElementById('search-err').textContent='';
  setTimeout(function(){document.getElementById('rid-input').focus();},50);
}

document.getElementById('rid-input').addEventListener('keydown',function(e){if(e.key==='Enter')doSearch();});
setLang('ar');
</script>
