<title>أمريكانا — عمليات التوصيل</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#0D1117;--card:#161B22;--s2:#1C232C;--brd:#2A323C;--brd2:#3B4654;
 --txt:#E9EDF2;--txt2:#9BA7B4;--txt3:#6E7B8A;
 --acc:#E3B341;--acc-d:#C99A2E;--acc-ink:#1A1405;
 --ok:#3fb950;--warn:#d29922;--bad:#f85149;--off:#7d8590}
body{background:
 radial-gradient(1200px 520px at 50% -180px,rgba(227,179,65,.11),transparent 70%),
 radial-gradient(700px 360px at 90% 10%,rgba(63,185,80,.045),transparent 70%),var(--bg);
 background-attachment:fixed;color:var(--txt);font-family:'Cairo',sans-serif;min-height:100vh;
 font-variant-numeric:tabular-nums}
.hdr{background:linear-gradient(180deg,rgba(22,27,34,.82),rgba(22,27,34,.96));backdrop-filter:blur(12px);
 border-bottom:1px solid var(--brd);padding:16px 24px;position:sticky;top:0;z-index:20}
.hdr::after{content:'';position:absolute;inset-inline:0;bottom:-1px;height:1px;
 background:linear-gradient(90deg,transparent,rgba(227,179,65,.6),transparent)}
.hdr-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr-t{font-size:19px;font-weight:900;letter-spacing:-.2px}
.hdr-s{font-size:11px;color:var(--txt3);margin-top:3px}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
 background:linear-gradient(140deg,rgba(227,179,65,.28),rgba(201,154,46,.06));
 border:1px solid rgba(227,179,65,.32);box-shadow:0 0 26px rgba(227,179,65,.16)}
.btn{background:var(--s2);border:1px solid var(--brd);border-radius:9px;color:var(--txt2);font-size:12px;
 font-weight:700;padding:8px 15px;cursor:pointer;font-family:inherit;text-decoration:none;transition:.15s}
.btn:hover{color:var(--txt);border-color:var(--brd2);background:#222b36}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn-p:hover{background:#f0c45c;border-color:#f0c45c}
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 60px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--card);border:1px solid var(--brd);
 border-radius:13px;padding:6px;margin-bottom:16px;width:fit-content;max-width:100%}
.tab{background:transparent;border:0;border-radius:9px;color:var(--txt2);font-family:inherit;font-size:13.5px;
 font-weight:800;padding:9px 20px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--acc);color:var(--acc-ink)}
.tab b{font-size:11px;font-weight:700;opacity:.8}

.warn{display:flex;gap:10px;align-items:flex-start;background:rgba(227,179,65,.07);
 border:1px solid rgba(227,179,65,.24);border-radius:12px;padding:12px 15px;margin-bottom:14px;
 font-size:12.5px;color:var(--txt2);line-height:1.7}
.warn b{color:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:linear-gradient(160deg,var(--card),#12171E);border:1px solid var(--brd);border-radius:13px;
 padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--acc)}
.kpi.g::before{background:var(--ok)}.kpi.r::before{background:var(--bad)}.kpi.y::before{background:var(--warn)}
.kpi-l{font-size:11px;color:var(--txt3);margin-bottom:7px}
.kpi-v{font-size:26px;font-weight:900;line-height:1}
.kpi-s{font-size:11px;color:var(--txt2);margin-top:5px}

.panel{background:var(--card);border:1px solid var(--brd);border-radius:13px;padding:15px 18px;margin-bottom:16px}
.panel-t{font-size:11px;color:var(--txt3);margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:96px 1fr 54px;align-items:center;gap:10px;font-size:12px}
.bar-l{color:var(--txt2);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t{height:9px;border-radius:5px;background:var(--s2);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar-v{color:var(--txt);font-weight:800;text-align:end}
.spark{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.spark i{display:block;width:100%;background:linear-gradient(180deg,var(--acc),rgba(227,179,65,.3));
 border-radius:4px 4px 0 0;min-height:2px}
.spark span{font-size:9.5px;color:var(--txt3);white-space:nowrap}
.spark b{font-size:10px;color:var(--txt2);font-weight:700}

.fbar{background:var(--card);border:1px solid var(--brd);border-radius:13px;padding:12px 14px;
 display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.fl{font-size:11px;color:var(--txt3);font-weight:700;margin-inline-start:4px}
.fb{background:var(--s2);border:1px solid var(--brd);border-radius:8px;color:var(--txt2);font-size:12px;
 font-weight:700;padding:6px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.fb:hover{color:var(--txt);border-color:var(--brd2)}
.fb.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.fs{flex:1;min-width:190px;background:var(--s2);border:1px solid var(--brd);border-radius:9px;padding:8px 14px;
 color:var(--txt);font-family:inherit;font-size:13px;outline:none;transition:.15s}
.fs::placeholder{color:var(--txt3)}
.fs:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(227,179,65,.14)}
.sel{background:var(--s2);border:1px solid var(--brd);border-radius:8px;color:var(--txt);font-size:12px;
 padding:7px 11px;font-family:inherit;cursor:pointer;outline:none}
.sel:focus{border-color:var(--acc)}

.tw{background:var(--card);border:1px solid var(--brd);border-radius:13px;overflow:auto;max-height:72vh}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;background:#1A212A;z-index:2;text-align:right;padding:12px;font-size:11px;
 color:var(--txt3);font-weight:700;border-bottom:1px solid var(--brd2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(42,50,60,.65);white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover td{background:rgba(227,179,65,.055)}
.rk{color:var(--txt3);font-weight:900;text-align:center;width:44px}
.rk1{color:#f5c451}.rk2{color:#a8b4c2}.rk3{color:#c08457}
.nm{font-weight:700}
.sub{font-size:10.5px;color:var(--txt3);margin-top:2px}
.mono{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--txt3);letter-spacing:.3px}
.num{font-weight:900;text-align:center}
.tag{display:inline-block;font-size:10px;padding:3px 10px;border-radius:11px;font-weight:700}
.t-ok{background:rgba(63,185,80,.15);color:var(--ok)}
.t-off{background:rgba(125,133,144,.16);color:var(--off)}
.t-warn{background:rgba(210,153,34,.16);color:var(--warn)}
.t-bad{background:rgba(248,81,73,.14);color:var(--bad)}
.t-acc{background:rgba(227,179,65,.15);color:var(--acc)}
.maplink{color:var(--acc);text-decoration:none;font-size:11.5px;font-weight:700;
 border:1px solid rgba(227,179,65,.3);border-radius:8px;padding:3px 9px;display:inline-block;transition:.15s}
.maplink:hover{background:rgba(227,179,65,.13);border-color:var(--acc)}
.late{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:9px;margin-top:3px;
 background:rgba(210,153,34,.15);color:var(--warn);font-weight:700}
.spk{display:flex;gap:2px;align-items:flex-end;height:22px}
.spk i{width:5px;background:var(--acc);border-radius:1px;min-height:2px;opacity:.85}
.spk i.z{background:var(--brd);opacity:.6;height:2px}
.empty{padding:56px 20px;text-align:center;color:var(--txt3)}
.cnt{font-size:11px;color:var(--txt3);margin:10px 2px}
.foot{text-align:center;color:var(--txt3);font-size:11px;padding:24px 0 6px}
.hide{display:none!important}
@media(max-width:640px){th,td{padding:8px;font-size:12px}.hdr-t{font-size:16px}.kpi-v{font-size:22px}}
</style>
</head>

var TAB = 'daily';
var F = {state:'all', leader:'all', status:'all', city:'all', brand:'all', region:'all'};
var TABS = [{k:'daily',t:'الأداء اليومي'},{k:'roster',t:'مناديبنا'},{k:'branch',t:'تغطية الفروع'}];
var MN = {'11-2025':'نوفمبر','01-2026':'يناير','02-2026':'فبراير','03-2026':'مارس','04-2026':'أبريل',
          '05-2026':'مايو','06-2026':'يونيو','07-2026':'يوليو','08-2026':'أغسطس'};
function n(v){return (v||0).toLocaleString('en-US')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function setTab(k){ TAB=k; F={state:'all',leader:'all',status:'all',city:'all',brand:'all',region:'all'}; draw(); }

function bars(title, obj, total){
  var ks=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a]});
  var mx=Math.max.apply(null,ks.map(function(k){return obj[k]}))||1;
  return '<div class="panel"><div class="panel-t">'+title+'</div><div class="bars">'+
    ks.map(function(k){
      return '<div class="bar"><span class="bar-l">'+esc(k)+'</span>'+
        '<span class="bar-t"><i style="width:'+(obj[k]*100/mx)+'%"></i></span>'+
        '<span class="bar-v">'+obj[k]+'</span></div>';
    }).join('')+'</div></div>';
}

function draw(){
  var t=DATA.totals;
  document.getElementById('sub').textContent =
    'سبتمبر 2026 · فري لانسر · '+t.rate+' ريال للطلب · حتى يوم '+t.last_day;
  document.getElementById('tabs').innerHTML=TABS.map(function(x){
    var c={daily:t.in_sheet,roster:t.roster,branch:t.cov.branches}[x.k];
    return '<button class="tab'+(x.k===TAB?' on':'')+'" onclick="setTab(\''+x.k+'\')">'+
           x.t+' <b>'+c+'</b></button>';
  }).join('');

  var w='';
  if(TAB==='roster')
    w='<div class="warn"><span>ℹ️</span><div>المعروض هم <b>'+t.roster+' مناديب</b> الحاليون — من جدول طلبات سبتمبر. '+
      'ورقة <b>Data</b> فيها <b>'+t.archive+' سجلاً</b> تشمل مناديب سابقين، وتُستخدم هنا لاستكمال '+
      'الإقامة والجوال والشفت والمركبة فقط.</div></div>';
  if(TAB==='branch')
    w='<div class="warn"><span>ℹ️</span><div>قائمة الفروع كاملة من فاتورة أغسطس (<b>'+n(t.cov.branches)+' فرع</b>). '+
      'الاسم يحمل الحي غالباً؛ ولا يتوفر عمود «حي» أو إحداثيات إلا لـ<b> '+t.cov.with_loc+' فرعاً</b> '+
      'وردت في خطة التوسّع. لعرض الموقع لكل فرع، أضف عمود رابط خرائط في ملف الفاتورة أو ورقة «اعداد مطلوبه».</div></div>';
  document.getElementById('warn').innerHTML=w;

  var K='';
  if(TAB==='daily'){
    K=[['','الطلبات',n(t.orders),t.last_day+' أيام · متوسط '+t.avg_day+'/يوم'],
       ['g','منتجون',t.working,'من '+t.in_sheet+' في جدول الشهر'],
       ['y','المستحق',n(t.due)+' ﷼',t.rate+' ريال × الطلب'],
       ['r','بلا إنتاج',t.in_sheet-t.working,'صفر طلبات هذا الشهر']];
  }else if(TAB==='roster'){
    K=[['','مناديبنا',t.roster,'الحاليون في سبتمبر'],
       ['g','منتجون',t.working,'من أصل '+t.roster],
       ['y','الفروع',new Set(DATA.drivers.map(function(d){return d.branch}).filter(Boolean)).size,'فرع نغطّيه'],
       ['r','في الأرشيف',t.archive,'مندوب سابق في ورقة Data']];
  }else{
    var c=t.cov;
    K=[['','فروع أمريكانا',n(c.branches),Object.keys(c.brands).map(function(b){return c.brands[b]+' '+b}).join(' · ')],
       ['g','عندنا مندوب',c.branches-c.vacant,Math.round((c.branches-c.vacant)*100/c.branches)+'% من الشبكة'],
       ['y','مطلوب تغطية',c.requested,'فرع مدرج في خطة التوسّع'],
       ['r','بدون مندوب',n(c.vacant),'فرصة غير مغطاة']];
  }
  document.getElementById('kpis').innerHTML=K.map(function(k){
    return '<div class="kpi '+k[0]+'"><div class="kpi-l">'+k[1]+'</div>'+
      '<div class="kpi-v">'+k[2]+'</div><div class="kpi-s">'+k[3]+'</div></div>';
  }).join('');

  var P='';
  if(TAB==='daily' && DATA.trend && DATA.trend.length){
    var mx=Math.max.apply(null,DATA.trend.map(function(x){return x.orders}));
    P='<div class="panel"><div class="panel-t">الطلبات الشهرية — من كشوف الرواتب</div><div class="spark">'+
      DATA.trend.map(function(x){
        return '<div><b>'+n(x.orders)+'</b><i style="height:'+(x.orders*100/mx)+'%"></i>'+
               '<span>'+(MN[x.month]||x.month)+'</span></div>';
      }).join('')+'</div></div>';
  }
  if(TAB==='roster') P=bars('المناديب حسب الليدر',t.leaders)+bars('المناديب حسب المنطقة',t.regions);
  document.getElementById('panels').innerHTML=P;

  var FB='';
  if(TAB==='daily'){
    FB='<span class="fl">الحالة:</span>'+
       chip('state','all','الكل')+chip('state','يعمل','يعمل')+chip('state','لا يعمل','لا يعمل');
  }else if(TAB==='roster'){
    FB='<span class="fl">الليدر:</span>'+chip('leader','all','الكل')+
       Object.keys(t.leaders).map(function(k){return chip('leader',k,k)}).join('');
  }else{
    var c=t.cov;
    FB='<span class="fl">المندوب:</span>'+chip('status','all','الكل')+
       chip('status','have','عندنا مندوب')+chip('status','none','بدون مندوب')+
       chip('status','req','مطلوب تغطية')+
       '<span class="fl">البراند:</span>'+chip('brand','all','الكل')+
       Object.keys(c.brands).map(function(b){return chip('brand',b,b+' '+c.brands[b])}).join('')+
       '<span class="fl">المنطقة:</span>'+chip('region','all','الكل')+
       Object.keys(c.regions).map(function(g){return chip('region',g,g+' '+c.regions[g])}).join('');
  }
  FB+='<input class="fs" id="q" placeholder="بحث..." oninput="render()"/>';
  document.getElementById('fbar').innerHTML=FB;
  render();
}
function chip(f,v,label){
  return '<button class="fb'+(F[f]===v?' on':'')+'" onclick="setF(\''+f+'\',\''+v+'\')">'+label+'</button>';
}
function setF(f,v){ F[f]=v; draw(); }

function rowsOf(){
  var q=(document.getElementById('q')||{value:''}).value.trim().toLowerCase();
  var hit=function(s){return !q || String(s||'').toLowerCase().indexOf(q)>-1};
  if(TAB==='daily') return DATA.daily.filter(function(r){
    if(F.state!=='all' && r.state!==F.state) return false;
    return hit(r.name)||hit(r.user)||hit(r.branch)||hit(r.supervisor);
  });
  if(TAB==='roster') return DATA.drivers.filter(function(r){
    if(F.leader!=='all' && r.leader!==F.leader) return false;
    return hit(r.name)||hit(r.user)||hit(r.branch)||hit(r.iqama)||hit(r.phone);
  });
  return DATA.branches.filter(function(r){
    if(F.status==='have' && !r.has_rider) return false;
    if(F.status==='none' && r.has_rider) return false;
    if(F.status==='req' && !(r.required>0)) return false;
    if(F.brand!=='all' && r.brand!==F.brand) return false;
    if(F.region!=='all' && r.region!==F.region) return false;
    return hit(r.name)||hit(r.city)||hit(r.district)||hit(r.manager)||hit(r.id)||hit((r.names||[]).join(' '));
  });
}

function spark(per,last){
  var s='';
  for(var d=1;d<=last;d++){
    var v=per[d]||0, mx=Math.max.apply(null,Object.keys(per).map(function(k){return per[k]}).concat([1]));
    s+= v>0 ? '<i style="height:'+Math.max(3,v*22/mx)+'px" title="يوم '+d+': '+v+'"></i>'
            : '<i class="z" title="يوم '+d+': 0"></i>';
  }
  return '<span class="spk">'+s+'</span>';
}

var COLS={
 daily:['#','المندوب','الفرع','المشرف','الطلبات','الأيام','النمط','متوسط/يوم','توقّع الشهر','المستحق','الحالة'],
 roster:['#','المندوب','اليوزر','الفرع','الشفت','الليدر','المركبة','الجوال','الطلبات','الحالة'],
 branch:['#','الفرع','البراند','المنطقة','المدينة / الحي','الموقع','مدير المنطقة','مطلوب','عندنا','المناديب','الحالة']};

function render(){
  var L=rowsOf(), t=DATA.totals;
  document.getElementById('th').innerHTML=COLS[TAB].map(function(c,i){
    return '<th'+(i===0?' class="rk"':'')+(i>3&&TAB!=='roster'?' style="text-align:center"':'')+'>'+c+'</th>';
  }).join('');
  document.getElementById('cnt').textContent='معروض '+L.length+' من '+
    (TAB==='daily'?DATA.daily.length:TAB==='roster'?DATA.drivers.length:DATA.branches.length);
  var tb=document.getElementById('tb'), emp=document.getElementById('emp');
  if(!L.length){ tb.innerHTML=''; emp.classList.remove('hide'); return; }
  emp.classList.add('hide');
  tb.innerHTML=L.map(function(r,i){
    var rk=i+1, rc=rk<=3?' rk'+rk:'';
    if(TAB==='daily'){
      return '<tr><td class="rk'+rc+'">'+rk+'</td>'+
        '<td><span class="nm">'+esc(r.name||'—')+'</span><div class="mono">'+esc(r.user)+'</div></td>'+
        '<td style="color:var(--txt2)">'+esc(r.branch)+'</td>'+
        '<td style="color:var(--txt2)">'+esc(r.supervisor)+'</td>'+
        '<td class="num" style="color:'+(r.orders?'var(--ok)':'var(--txt3)')+'">'+n(r.orders)+'</td>'+
        '<td class="num" style="color:var(--txt2)">'+(r.work_days||'—')+
          (r.start_day>1?'<div><span class="late">بدأ يوم '+r.start_day+'</span></div>':'')+'</td>'+
        '<td style="text-align:center">'+spark(r.per,t.last_day)+'</td>'+
        '<td class="num" style="color:var(--txt2)">'+(r.avg||'—')+'</td>'+
        '<td class="num" style="color:var(--txt2)">'+(r.proj?n(r.proj):'—')+'</td>'+
        '<td class="num" style="color:var(--warn)">'+(r.due?n(r.due):'—')+'</td>'+
        '<td style="text-align:center"><span class="tag '+(r.orders?'t-ok':'t-off')+'">'+r.state+'</span></td></tr>';
    }
    if(TAB==='roster'){
      return '<tr><td class="rk">'+rk+'</td>'+
        '<td><span class="nm">'+esc(r.name)+'</span><div class="mono">'+esc(r.iqama)+'</div></td>'+
        '<td class="mono" style="color:var(--txt2)">'+esc(r.user)+'</td>'+
        '<td style="color:var(--txt2)">'+esc(r.branch)+(r.region?'<div class="mono">'+esc(r.region)+'</div>':'')+'</td>'+
        '<td><span class="tag t-acc">'+esc(r.shift)+'</span></td>'+
        '<td style="color:var(--txt2)">'+esc(r.leader)+'</td>'+
        '<td style="color:var(--txt2)">'+(r.vehicle==='car'?'سيارة':r.vehicle==='bike'?'دراجة':esc(r.vehicle))+'</td>'+
        '<td class="mono">'+esc(r.phone||'—')+'</td>'+
        '<td class="num" style="color:'+(r.orders?'var(--ok)':'var(--txt3)')+'">'+n(r.orders)+'</td>'+
        '<td style="text-align:center"><span class="tag '+(r.orders?'t-ok':'t-off')+'">'+r.state+'</span></td></tr>';
    }
    var sc=r.has_rider?'t-ok':'t-bad';
    return '<tr><td class="rk">'+rk+'</td>'+
      '<td><span class="nm">'+esc(r.name||('فرع '+r.id))+'</span><div class="mono">'+r.id+
        (r.region?' · '+esc(r.region):'')+'</div></td>'+
      '<td><span class="tag '+(r.brand==='KFC'?'t-bad':r.brand==='Pizza Hut'?'t-warn':'t-acc')+'">'+
        esc(r.brand)+'</span></td>'+
      '<td style="color:var(--txt2)">'+esc(r.region||'—')+'</td>'+
      '<td style="color:'+((r.city||r.district)?'var(--txt2)':'var(--txt3)')+'">'+
        esc([r.city,r.district].filter(Boolean).join(' · ')||'—')+'</td>'+
      '<td style="text-align:center">'+(r.loc
        ? '<a class="maplink" href="'+esc(r.loc)+'" target="_blank" rel="noopener">📍 خريطة</a>'
        : '<span style="color:var(--txt3)">—</span>')+'</td>'+
      '<td style="color:var(--txt2)">'+esc(r.manager||r.branch_mgr||'—')+
        (r.branch_phone?'<div class="mono">'+esc(r.branch_phone)+'</div>':'')+'</td>'+
      '<td class="num" style="color:'+(r.required?'var(--warn)':'var(--txt3)')+'">'+(r.required||'—')+'</td>'+
      '<td class="num" style="color:'+(r.actual?'var(--ok)':'var(--txt3)')+'">'+(r.actual||'—')+'</td>'+
      '<td style="color:var(--txt2);font-size:12px;white-space:normal;max-width:230px">'+
        esc((r.names||[]).join('، ')||r.assigned||'—')+'</td>'+
      '<td style="text-align:center"><span class="tag '+sc+'">'+
        (r.has_rider?'عندنا مندوب':'بدون مندوب')+'</span>'+
        (r.has_rider&&r.gap>0?'<div class="late">ناقص '+r.gap+'</div>':'')+'</td></tr>';
  }).join('');
}

function exportCSV(){
  var L=rowsOf(), H, R;
  if(TAB==='daily'){
    H=['#','المندوب','اليوزر','الفرع','المشرف','الطلبات','أيام العمل','بدأ يوم','متوسط/يوم','توقّع الشهر','المستحق','الحالة'];
    R=L.map(function(r,i){return [i+1,r.name,r.user,r.branch,r.supervisor,r.orders,r.work_days,
      r.start_day||'',r.avg,r.proj,r.due,r.state]});
  }else if(TAB==='roster'){
    H=['#','الاسم','رقم الإقامة','اليوزر','كود الفرع','الفرع','المنطقة','الشفت','الليدر','المركبة','الجوال','الطلبات','الحالة','الحساب البنكي','ملاحظات'];
    R=L.map(function(r,i){return [i+1,r.name,r.iqama,r.user,r.vendor,r.branch,r.region,r.shift,
      r.leader,r.vehicle,r.phone,r.orders,r.state,r.bank,r.note]});
  }else{
    H=['#','كود الفرع','الفرع','البراند','المنطقة','المدينة','الحي','رابط الموقع','مدير المنطقة','مدير الفرع',
       'جوال الفرع','المرحلة','مطلوب','صباحي','مسائي','عندنا','النقص','المناديب','هل يوجد مندوب'];
    R=L.map(function(r,i){return [i+1,r.id,r.name,r.brand,r.region,r.city,r.district,r.loc,r.manager,
      r.branch_mgr,r.branch_phone,r.phase,r.required,r.morning,r.evening,r.actual,
      r.gap>0?r.gap:0,(r.names||[]).join(' / ')||r.assigned,r.has_rider?'نعم':'لا']});
  }
  var csv='﻿'+[H].concat(R).map(function(row){
    return row.map(function(c){c=(c==null?'':String(c));return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')
  }).join('\r\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='أمريكانا_'+({daily:'الأداء_اليومي',roster:'كشف_المناديب',branch:'تغطية_الفروع'}[TAB])+'_سبتمبر_2026.csv';
  a.click();
}
draw();
</script>
</body>
</html>
