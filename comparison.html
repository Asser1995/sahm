<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تقارير التطبيقات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090d;--card:#0f1117;--brd:#1e2530;--txt:#e2e8f0;--txt2:#94a3b8;--txt3:#5b6675;
  --keeta:#eab308;--hunger:#f97316;--purple:#a855f7;--masar:#0ea5e9;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:24px;direction:rtl}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(249,115,22,.08),transparent),
  radial-gradient(ellipse 60% 40% at 80% 80%,rgba(234,179,8,.08),transparent),
  radial-gradient(ellipse 40% 40% at 50% 50%,rgba(168,85,247,.06),transparent)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.home-btn{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;
  background:var(--card);border:1px solid var(--brd);border-radius:10px;
  color:var(--txt2);text-decoration:none;font-size:13px;font-weight:600;transition:.2s;
}
.home-btn:hover{border-color:var(--purple);color:var(--purple)}
.page-title{font-size:clamp(20px,4vw,32px);font-weight:900;flex:1}
.page-title .k{color:var(--keeta)}.page-title .h{color:var(--hunger)}
.print-btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 20px;
  background:linear-gradient(135deg,var(--purple),#7c3aed);border:none;border-radius:10px;
  color:#fff;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;
}
.print-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(168,85,247,.4)}
.section-card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:24px;margin-bottom:20px}
.section-title{font-size:14px;font-weight:700;color:var(--txt2);margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:16px;background:var(--purple);border-radius:2px;flex-shrink:0}

/* Month checkboxes */
.months-grid{display:flex;flex-wrap:wrap;gap:12px}
.month-check{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:#161b25;border:1px solid var(--brd);border-radius:10px;cursor:pointer;transition:.2s;
  user-select:none}
.month-check:hover{border-color:rgba(255,255,255,.2)}
.month-check.active-keeta{border-color:var(--keeta);background:rgba(234,179,8,.08)}
.month-check.active-hunger{border-color:var(--hunger);background:rgba(249,115,22,.08)}
.month-check.active-masar{border-color:var(--masar);background:rgba(14,165,233,.08)}
.month-check input{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.month-label{font-size:13px;font-weight:600}

/* Search */
.search-wrap{position:relative}
.search-input{
  width:100%;padding:12px 16px;background:#161b25;border:1px solid var(--brd);border-radius:12px;
  color:var(--txt);font-family:'Cairo',sans-serif;font-size:15px;font-weight:600;outline:none;transition:.2s;
}
.search-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.autocomplete{
  position:absolute;top:100%;right:0;left:0;margin-top:4px;
  background:#1a1f2e;border:1px solid var(--brd);border-radius:10px;z-index:100;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;
}
.ac-item{
  padding:10px 16px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.05);transition:.15s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:rgba(168,85,247,.15)}
.ac-badges{display:flex;gap:6px;margin-right:auto}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.badge-keeta{background:rgba(234,179,8,.2);color:var(--keeta);border:1px solid rgba(234,179,8,.3)}
.badge-hunger{background:rgba(249,115,22,.2);color:var(--hunger);border:1px solid rgba(249,115,22,.3)}
.badge-masar{background:rgba(14,165,233,.15);color:#0ea5e9}

/* Driver header */
.driver-header{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.driver-name{font-size:22px;font-weight:900}
.info-chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:8px;font-size:12px;font-weight:600;
}
.chip-keeta{background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.3);color:var(--keeta)}
.chip-hunger{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);color:var(--hunger)}

/* Table */
.table-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  background:#161b25;padding:10px 12px;border:1px solid var(--brd);
  font-weight:700;color:var(--txt2);white-space:nowrap;text-align:center;font-size:12px;
}
td{padding:9px 12px;border:1px solid var(--brd);text-align:center;color:var(--txt)}
tr:hover td{background:rgba(255,255,255,.03)}
.app-keeta td:first-child{border-right:3px solid var(--keeta)}
.app-hunger td:first-child{border-right:3px solid var(--hunger)}
.total-row td{background:#1a1f2e !important;font-weight:900;color:#fff}
.status-s{color:#22c55e;font-weight:700}
.status-m{color:#eab308;font-weight:700}
.status-h{color:#f97316;font-weight:700}
.status-n{color:#ef4444;font-weight:700}
.status-a{color:#22c55e;font-weight:700}
.details-cell{font-size:11px;color:var(--txt2);text-align:right}
.empty-msg{text-align:center;padding:40px;color:var(--txt3);font-size:14px}
.hidden{display:none!important}


/* print-hide: visible on screen, hidden in print */
.print-hide{}
@page{size:landscape;margin:10mm}
@media print{
  .print-hide{display:none!important}
}
/* ===== PRINT STYLES ===== */
@page{size:A3 landscape;margin:8mm}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#000!important;padding:0!important;margin:0!important}
  body::before{display:none!important}

  /* Hide everything except the result section */
  .topbar,
  .section-card:not(#result-section),
  #result-section .section-title{
    display:none!important;
  }

  /* Show result section cleanly */
  #result-section{
    display:block!important;
    background:#fff!important;
    border:none!important;
    padding:0!important;
    margin:0!important;
  }
  .wrap{max-width:none!important;padding:0!important}

  /* Show print-only header */
  #print-header{display:block!important}

  /* Driver header */
  .driver-header{margin-bottom:8px;flex-wrap:nowrap!important}
  .driver-name{color:#000!important;font-size:13px!important}

  /* Table: natural size matching screen */
  .table-wrap{
    overflow:visible!important;
    width:100%!important;
  }
  table{
    width:100%!important;
    border-collapse:collapse!important;
    font-size:12px!important;
    table-layout:auto!important;
  }
  th{
    background:#e5e7eb!important;color:#000!important;
    border:1px solid #999!important;
    padding:8px 10px!important;
    white-space:nowrap!important;
    font-size:12px!important;
  }
  td{
    background:#fff!important;color:#000!important;
    border:1px solid #bbb!important;
    padding:7px 10px!important;
    white-space:nowrap!important;
  }
  tr:hover td{background:#fff!important}

  .app-keeta td:first-child{border-right:3px solid #b45309!important}
  .app-hunger td:first-child{border-right:3px solid #c2410c!important}
  .app-masar td:first-child{border-right:3px solid #0369a1!important}

  .total-row td{background:#f3f4f6!important;color:#000!important;font-weight:900!important}
  .status-s{color:#15803d!important}
  .status-m{color:#b45309!important}
  .status-f{color:#b91c1c!important}
  .badge{border:1px solid #999!important;color:#000!important;background:#f5f5f5!important;font-size:8px!important}

  table{page-break-inside:auto}
  tr{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <!-- Print-only company header -->
  <div id="print-header" style="display:none">
    <div id="company-name" style="font-size:16px;font-weight:900;text-align:center;margin-bottom:4px"></div>
    <div style="font-size:13px;font-weight:600;text-align:center;color:#555;margin-bottom:12px">قسم التشغيل</div>
    <hr style="border:1px solid #999;margin-bottom:10px">
  </div>
  <div class="topbar">
    <a class="home-btn" href="index.html">🏠 الرئيسية</a>
    <div class="page-title">تقارير التطبيقات</div>
    <button class="print-btn" id="refresh-btn" onclick="triggerRefresh()" style="background:linear-gradient(135deg,#0ea5e9,#0369a1);margin-left:0">🔄 تحديث</button>
    <button class="print-btn" onclick="printReport()">🖨️ طباعة</button>
  </div>

  <!-- Month Selection -->
  <div class="section-card">
    <div class="section-title">اختر الأشهر</div>
    <div style="position:relative">
      <button onclick="toggleMonthsDrop()" id="months-btn"
        style="width:100%;padding:9px 14px;background:#161b25;border:1px solid var(--brd);border-radius:8px;color:var(--txt);font-family:inherit;font-size:13px;text-align:right;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <span id="months-label">كل الأشهر</span><span>▾</span>
      </button>
      <div id="months-drop" style="display:none;position:absolute;top:calc(100% + 4px);right:0;left:0;background:#161b25;border:1px solid var(--brd);border-radius:8px;z-index:50;padding:6px 0;box-shadow:0 8px 24px rgba(0,0,0,.4)">
        <div id="months-grid"></div>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="section-card">
    <div class="section-title">بحث عن سائق برقم الإقامة</div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-iqama" placeholder="أدخل رقم الإقامة..." autocomplete="off" inputmode="numeric"
        oninput="selectedIqama=null;resolvedNames={};onSearchIqama(this.value)" onkeydown="if(event.key==='Enter') runReport()">
      <div class="autocomplete" id="ac-iqama"></div>
    </div>
    <div id="sel-result" style="margin-top:6px;font-size:12px;color:#94a3b8"></div>
    <button onclick="runReport()" style="margin-top:10px;width:100%;padding:10px;background:linear-gradient(135deg,#eab308,#f97316);border:none;border-radius:8px;color:#000;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">🔍 عرض التقرير</button>
    <div id="run-error" style="display:none;margin-top:8px;color:#f87171;font-size:12px;text-align:center"></div>
  </div>

  <!-- Result -->
  <div class="section-card hidden" id="result-section">
    <div class="section-title">نتائج المقارنة</div>
    <div class="driver-header" id="driver-header"></div>
    <div class="table-wrap">
      <table id="result-table">
        <thead>
          <tr>
            <th>الشهر</th><th>التطبيق</th><th>المدينة</th><th>المركبة</th>
            <th>أيام العمل</th><th>الأيام الصالحة</th><th>الطلبات المكتملة</th>
            <th>المرفوضة</th><th>نسبة القبول</th><th>ويكيند</th>
            <th>Face ID</th><th>متوسط KM</th><th>المحفظة</th><th>الكلاس</th><th>الحالة</th>
          </tr>
        </thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
  </div>
</div>

const MONTH_LABELS = {'05-2026':'مايو 2026','06-2026':'يونيو 2026'};
const APP_LABELS = {keeta:'كيتا',hunger:'هنقر',masar:'مسار ماب'};
const APP_COLOR = {keeta:'keeta',hunger:'hunger',masar:'masar'};

// ─── build iqama index ──────────────────────────────────────────────────────
const IQAMA_INDEX = {};
const ALL_MONTHS = new Set();

function indexDrivers(appKey, data) {
  for (const [month, mdata] of Object.entries(data)) {
    ALL_MONTHS.add(month);
    for (const d of (mdata.drivers || [])) {
      const iq = String(d.iqama || '').trim();
      if (!iq) continue;
      if (!IQAMA_INDEX[iq]) IQAMA_INDEX[iq] = [];
      IQAMA_INDEX[iq].push({month, app: appKey, driver: d});
    }
  }
}
indexDrivers('keeta', KEETA_DATA);
indexDrivers('hunger', HUNGER_DATA);
indexDrivers('masar', MASAR_DATA);

// ─── state ──────────────────────────────────────────────────────────────────
let selectedIqama = null;
let resolvedNames = {};
let selectedMonths = new Set([...ALL_MONTHS]);

// ─── month selector ─────────────────────────────────────────────────────────
function buildMonthSelector() {
  const grid = document.getElementById('months-grid');
  const sorted = [...ALL_MONTHS].sort();
  grid.innerHTML = sorted.map(m => `
    <label style="display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;hover:background:#1a1f2e">
      <input type="checkbox" checked onchange="toggleMonth('${m}',this.checked)" style="accent-color:var(--purple)">
      <span style="font-size:13px">${MONTH_LABELS[m]||m}</span>
    </label>`).join('');
}
function toggleMonth(m, checked) {
  if (checked) selectedMonths.add(m); else selectedMonths.delete(m);
  updateMonthLabel();
  if (selectedIqama) runReport();
}
function toggleMonthsDrop() {
  const d = document.getElementById('months-drop');
  d.style.display = d.style.display==='none' ? 'block' : 'none';
}
function updateMonthLabel() {
  const sorted = [...ALL_MONTHS].sort();
  const active = sorted.filter(m => selectedMonths.has(m));
  document.getElementById('months-label').textContent =
    active.length === sorted.length ? 'كل الأشهر' :
    active.map(m => MONTH_LABELS[m]||m).join('، ') || 'لا يوجد';
}
document.addEventListener('click', e => {
  const drop = document.getElementById('months-drop');
  const btn = document.getElementById('months-btn');
  if (!btn.contains(e.target) && !drop.contains(e.target)) drop.style.display = 'none';
});

// ─── autocomplete ────────────────────────────────────────────────────────────
function onSearchIqama(val) {
  const ac = document.getElementById('ac-iqama');
  if (!val || val.length < 4) { ac.style.display = 'none'; return; }
  const matches = Object.keys(IQAMA_INDEX).filter(iq => iq.includes(val)).slice(0,10);
  if (!matches.length) { ac.style.display = 'none'; return; }
  ac.innerHTML = matches.map(iq => {
    const entries = IQAMA_INDEX[iq];
    const name = entries[0]?.driver?.name || '';
    const apps = [...new Set(entries.map(e => e.app))];
    const badges = apps.map(a => `<span class="badge badge-${a}">${APP_LABELS[a]}</span>`).join('');
    return `<div class="ac-item" onclick="selectIqama('${iq}')">
      <span style="font-size:12px;color:#94a3b8">${iq}</span>
      <span style="flex:1;font-weight:700">${name}</span>
      <div class="ac-badges">${badges}</div>
    </div>`;
  }).join('');
  ac.style.display = 'block';
}
function selectIqama(iq) {
  selectedIqama = iq;
  const entries = IQAMA_INDEX[iq];
  const name = entries[0]?.driver?.name || iq;
  document.getElementById('search-iqama').value = iq;
  document.getElementById('sel-result').textContent = `✓ ${name}`;
  document.getElementById('ac-iqama').style.display = 'none';
  runReport();
}

// ─── field extraction ────────────────────────────────────────────────────────
function extractRow(app, month, d) {
  const ml = MONTH_LABELS[month] || month;
  const al = APP_LABELS[app];
  if (app === 'keeta') {
    const rej = '-';
    return {
      month: ml, app: al, appKey: app, city: d.city||'',
      vehicle: d.type||'', work_days: d.worked||0,
      valid: d.valid||0, orders: d.orders||0, target: d.min_orders||0,
      planned: '-', accepted: '-', rejected: rej,
      hours: '-', ar: '-', wknd: '-',
      face: typeof d.face_id==='number'?d.face_id.toFixed(1)+'%':d.face_id||'-',
      mod: d.mod||0, km: d.avg_km||0,
      wallet: '-',
      vehicle_class: (()=>{
        const o=d.orders||0, c=d.city||'';
        if(c==='Riyadh'){ return o>=550?'A':o>=420?'B':o>=300?'C':'D'; }
        else { return o>=600?'A':o>=500?'B':o>=400?'C':'D'; }
      })(),
      status: d.probability||''
    };
  } else {
    const ar = d.acceptance_rate != null
      ? (d.acceptance_rate<=1 ? (d.acceptance_rate*100).toFixed(1) : d.acceptance_rate.toFixed(1))+'%'
      : '-';
    return {
      month: ml, app: al, appKey: app, city: d.city||'',
      vehicle: d.vehicle||'', work_days: d.work_days||0,
      valid: (app==='hunger'||app==='masar') ? (d.days_8h||d.work_days||0) : d.work_days||0,
      orders: d.completed||0, target: d.target||0,
      planned: d.planned||0, accepted: d.accepted||0,
      rejected: (d.planned||0)-(d.accepted||0),
      hours: d.hours||0, ar,
      wknd: d.wknd_absent!=null?d.wknd_absent:'-',
      face: '-', mod: '-', km: typeof d.km==='number'?d.km.toFixed(1):'-',
      wallet: d.wallet!=null?d.wallet.toFixed(2):'-',
      vehicle_class: '-',
      status: d.status||''
    };
  }
}

// ─── run report ──────────────────────────────────────────────────────────────
function runReport() {
  const errEl = document.getElementById('run-error');
  if (!selectedIqama) {
    const val = document.getElementById('search-iqama').value.trim();
    if (!val) { errEl.style.display='block'; errEl.textContent='أدخل رقم الإقامة أولاً'; return; }
    if (IQAMA_INDEX[val]) { selectIqama(val); return; }
    errEl.style.display='block'; errEl.textContent='لم يتم العثور على سائق بهذا الرقم'; return;
  }
  errEl.style.display='none';

  const entries = (IQAMA_INDEX[selectedIqama]||[]).filter(e => selectedMonths.has(e.month));
  if (!entries.length) {
    document.getElementById('result-section').classList.add('hidden');
    errEl.style.display='block'; errEl.textContent='لا توجد بيانات للأشهر المختارة'; return;
  }

  const d0 = entries[0].driver;
  const name = d0.name || selectedIqama;
  const apps = [...new Set(entries.map(e=>e.app))];
  // driver header — no app badges in print, iqama shown separately
  const appBadgesScreen = apps.map(a=>`<span class="info-chip chip-${a}">${APP_LABELS[a]}</span>`).join('');
  // Set company name for print
  const isMasarOnly = apps.every(a=>a==='masar');
  const companyName = isMasarOnly ? 'مسار ماب للنقل' : 'منصة سهم التجارية';
  document.getElementById('company-name').textContent = companyName;
  document.getElementById('print-header').style.display = 'none'; // shown via CSS in print

  document.getElementById('driver-header').innerHTML =
    `<div class="driver-name">${name}</div>
     <span style="font-size:13px;color:#94a3b8">${selectedIqama}</span>
     <span class="print-hide">${appBadgesScreen}</span>`;

  // build rows
  const rows = entries.map(e => extractRow(e.app, e.month, e.driver));

  const statusClass = s => s==='صالح'||s==='محقق'?'status-s':s==='ممكن'||s==='غير محقق'?'status-m':'status-f';

  const tbody = document.getElementById('result-body');
  tbody.innerHTML = rows.map(r =>
    `<tr class="app-${r.appKey}">
      <td>${r.month}</td>
      <td><span class="badge badge-${r.appKey}">${r.app}</span></td>
      <td>${r.city}</td>
      <td>${r.vehicle}</td>
      <td>${r.work_days}</td>
      <td>${r.valid}</td>
      <td>${r.orders}</td>
      <td>${r.rejected}</td>
      <td>${r.ar}</td>
      <td>${r.wknd}</td>
      <td>${r.face}</td>
      <td>${r.km}</td>
      <td>${r.wallet}</td>
      <td>${r.vehicle_class}</td>
      <td class="${statusClass(r.status)}">${r.status}</td>
    </tr>`
  ).join('');

  document.getElementById('result-section').classList.remove('hidden');
}

function printReport() { window.print(); }
function triggerRefresh() { location.reload(); }

window.addEventListener('DOMContentLoaded', () => {
  buildMonthSelector();
});
</script>
