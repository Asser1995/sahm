<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>تقارير التطبيقات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090d;--card:#0f1117;--brd:#1e2530;--txt:#e2e8f0;--txt2:#94a3b8;--txt3:#5b6675;
  --keeta:#eab308;--hunger:#f97316;--purple:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding:24px;direction:rtl}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(249,115,22,.08),transparent),
  radial-gradient(ellipse 60% 40% at 80% 80%,rgba(234,179,8,.08),transparent),
  radial-gradient(ellipse 40% 40% at 50% 50%,rgba(168,85,247,.06),transparent)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.home-btn{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;
  background:var(--card);border:1px solid var(--brd);border-radius:10px;
  color:var(--txt2);text-decoration:none;font-size:13px;font-weight:600;transition:.2s;
}
.home-btn:hover{border-color:var(--purple);color:var(--purple)}
.page-title{font-size:clamp(20px,4vw,32px);font-weight:900;flex:1}
.page-title .k{color:var(--keeta)}.page-title .h{color:var(--hunger)}
.print-btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 20px;
  background:linear-gradient(135deg,var(--purple),#7c3aed);border:none;border-radius:10px;
  color:#fff;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;
}
.print-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(168,85,247,.4)}
.section-card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:24px;margin-bottom:20px}
.section-title{font-size:14px;font-weight:700;color:var(--txt2);margin-bottom:16px;
  display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:16px;background:var(--purple);border-radius:2px;flex-shrink:0}

/* Month checkboxes */
.months-grid{display:flex;flex-wrap:wrap;gap:12px}
.month-check{display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:#161b25;border:1px solid var(--brd);border-radius:10px;cursor:pointer;transition:.2s;
  user-select:none}
.month-check:hover{border-color:rgba(255,255,255,.2)}
.month-check.active-keeta{border-color:var(--keeta);background:rgba(234,179,8,.08)}
.month-check.active-hunger{border-color:var(--hunger);background:rgba(249,115,22,.08)}
.month-check input{display:none}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.month-label{font-size:13px;font-weight:600}

/* Search */
.search-wrap{position:relative}
.search-input{
  width:100%;padding:12px 16px;background:#161b25;border:1px solid var(--brd);border-radius:12px;
  color:var(--txt);font-family:'Cairo',sans-serif;font-size:15px;font-weight:600;outline:none;transition:.2s;
}
.search-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.autocomplete{
  position:absolute;top:100%;right:0;left:0;margin-top:4px;
  background:#1a1f2e;border:1px solid var(--brd);border-radius:10px;z-index:100;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;
}
.ac-item{
  padding:10px 16px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.05);transition:.15s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:rgba(168,85,247,.15)}
.ac-badges{display:flex;gap:6px;margin-right:auto}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700}
.badge-keeta{background:rgba(234,179,8,.2);color:var(--keeta);border:1px solid rgba(234,179,8,.3)}
.badge-hunger{background:rgba(249,115,22,.2);color:var(--hunger);border:1px solid rgba(249,115,22,.3)}
.badge-masar{background:rgba(34,211,238,.2);color:var(--hr);border:1px solid rgba(34,211,238,.3)}

/* Driver header */
.driver-header{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.driver-name{font-size:22px;font-weight:900}
.info-chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:8px;font-size:12px;font-weight:600;
}
.chip-keeta{background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.3);color:var(--keeta)}
.chip-hunger{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);color:var(--hunger)}

/* Table */
.table-wrap{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  background:#161b25;padding:10px 12px;border:1px solid var(--brd);
  font-weight:700;color:var(--txt2);white-space:nowrap;text-align:center;font-size:12px;
}
td{padding:9px 12px;border:1px solid var(--brd);text-align:center;color:var(--txt)}
tr:hover td{background:rgba(255,255,255,.03)}
.app-keeta td:first-child{border-right:3px solid var(--keeta)}
.app-hunger td:first-child{border-right:3px solid var(--hunger)}
.app-masar td:first-child{border-right:3px solid var(--hr)}
.total-row td{background:#1a1f2e !important;font-weight:900;color:#fff}
.status-s{color:#22c55e;font-weight:700}
.status-m{color:#eab308;font-weight:700}
.status-h{color:#f97316;font-weight:700}
.status-n{color:#ef4444;font-weight:700}
.status-a{color:#22c55e;font-weight:700}
.details-cell{font-size:11px;color:var(--txt2);text-align:right}
.empty-msg{text-align:center;padding:40px;color:var(--txt3);font-size:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="home-btn" href="index.html">🏠 الرئيسية</a>
    <div class="page-title">تقارير التطبيقات</div>
    <button class="print-btn" id="refresh-btn" onclick="triggerRefresh()" style="background:linear-gradient(135deg,#0ea5e9,#0369a1);margin-left:0">🔄 تحديث</button>
    <button class="print-btn" onclick="printReport()">🖨️ طباعة</button>
  </div>

  <!-- Month Selection -->
  <div class="section-card">
    <div class="section-title">اختر الأشهر</div>
    <div style="position:relative">
      <button onclick="toggleMonthsDrop()" id="months-btn"
        style="width:100%;padding:9px 14px;background:#161b25;border:1px solid var(--brd);border-radius:8px;color:var(--txt);font-family:inherit;font-size:13px;text-align:right;cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <span id="months-label">كل الأشهر</span><span>▾</span>
      </button>
      <div id="months-drop" style="display:none;position:absolute;top:calc(100% + 4px);right:0;left:0;background:#161b25;border:1px solid var(--brd);border-radius:8px;z-index:50;padding:6px 0;box-shadow:0 8px 24px rgba(0,0,0,.4)">
        <div id="months-grid"></div>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="section-card">
    <div class="section-title">بحث عن سائق برقم الإقامة</div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-iqama" placeholder="أدخل رقم الإقامة..." autocomplete="off" inputmode="numeric"
        oninput="selectedIqama=null;resolvedNames={};onSearchIqama(this.value)" onkeydown="if(event.key==='Enter') runReport()">
      <div class="autocomplete" id="ac-iqama"></div>
    </div>
    <div id="sel-result" style="margin-top:6px;font-size:12px;color:#94a3b8"></div>
    <button onclick="runReport()" style="margin-top:10px;width:100%;padding:10px;background:linear-gradient(135deg,#eab308,#f97316);border:none;border-radius:8px;color:#000;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer">🔍 عرض التقرير</button>
    <div id="run-error" style="display:none;margin-top:8px;color:#f87171;font-size:12px;text-align:center"></div>
  </div>

  <!-- Result -->
  <div class="section-card hidden" id="result-section">
    <div class="section-title">نتائج المقارنة</div>
    <div class="driver-header" id="driver-header"></div>
    <div class="table-wrap">
      <table id="result-table">
        <thead>
          <tr>
            <th>الشهر</th><th>التطبيق</th><th>المدينة</th><th>المركبة</th>
            <th>أيام العمل</th><th>الأيام الصالحة</th><th>الطلبات</th><th>المرفوضة</th>
            <th>ساعات العمل</th><th>نسبة القبول</th><th>ويكيند</th>
            <th>Face ID</th><th>متوسط KM</th><th>المحفظة</th>
            <th>الكلاس</th><th>الحالة</th>
          </tr>
        </thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
  </div>
</div>

  Baha:'الباحة','Abha province':'أبها',Tabuk:'تبوك',Hail:'حائل',Jizan:'جيزان',Najran:'نجران',Qassim:'القصيم'};
const vehicleMap = {car:'سيارة',bike:'دباب'};

let selectedMonths = new Set();
let currentDriver = null;

// Build month checkboxes
function initMonths() {
  const grid = document.getElementById('months-grid');
  MONTHS.forEach(m => {
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:13px;user-select:none';
    label.innerHTML = `<input type="checkbox" value="${m.id}" checked style="width:15px;height:15px;accent-color:#eab308;cursor:pointer">
      <span>${m.label}</span>`;
    label.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selectedMonths.add(m.id);
      else selectedMonths.delete(m.id);
      updateMonthsLabel();
    });
    selectedMonths.add(m.id);
    grid.appendChild(label);
  });
  updateMonthsLabel();
}

function updateMonthsLabel() {
  const lbl = document.getElementById('months-label');
  if (selectedMonths.size === MONTHS.length) lbl.textContent = 'كل الأشهر';
  else if (selectedMonths.size === 0) lbl.textContent = 'لا يوجد اختيار';
  else lbl.textContent = MONTHS.filter(m=>selectedMonths.has(m.id)).map(m=>m.label).join('، ');
}

function toggleMonthsDrop() {
  const drop = document.getElementById('months-drop');
  drop.style.display = drop.style.display === 'none' ? 'block' : 'none';
}

document.addEventListener('click', e => {
  if (!e.target.closest('#months-btn') && !e.target.closest('#months-drop'))
    document.getElementById('months-drop').style.display = 'none';
});

function getDataForMonth(app, monthId) {
  const data = app === 'keeta' ? KEETA_DATA : app === 'masar' ? MASAR_DATA : HUNGER_DATA;
  return data[monthId] || null;
}

function getDriversFromSelected() {
  const allDrivers = {};
  selectedMonths.forEach(key => {
    const [app, monthId] = key.split(':');
    const monthData = getDataForMonth(app, monthId);
    if (!monthData || !monthData.drivers) return;
    monthData.drivers.forEach(d => {
      const nameLow = d.name.toLowerCase().trim();
      if (!allDrivers[nameLow]) allDrivers[nameLow] = d.name;
    });
  });
  return allDrivers;
}

// Single iqama search
let selectedIqama = null, resolvedNames = {};  // resolvedNames = {keeta: name, hunger: name}

function onSearchIqama(val) {
  const ac = document.getElementById('ac-iqama');
  const q = val.trim();
  if (q.length < 4) { ac.style.display='none'; return; }

  const seen = new Map(); // iqama → {iqama, names:{keeta,hunger}}
  ['keeta','hunger','masar'].forEach(app => {
    selectedMonths.forEach(monthId => {
      const md = getDataForMonth(app, monthId);
      if (!md || !md.drivers) return;
      md.drivers.forEach(d => {
        const iq = d.iqama ? String(d.iqama) : '';
        if (iq.includes(q) || (app==='hunger' && String(d.id||'').includes(q))) {
          if (!seen.has(iq)) seen.set(iq, {iqama: iq, names:{}, name: d.name});
          seen.get(iq).names[app] = d.name;
        }
      });
    });
  });

  const results = [...seen.values()].slice(0,10);
  if (!results.length) { ac.style.display='none'; return; }
  ac.innerHTML = results.map(r => {
    const nameStr = Object.entries(r.names).map(([app,n])=>`<span class="badge badge-${app}">${app==='keeta'?'كيتا':app==='masar'?'مسار':'هنقر'}</span> ${n}`).join(' | ');
    return `<div class="ac-item" onclick="selectIqama('${r.iqama}')">
      <div style="font-weight:700">${r.iqama}</div>
      <div style="font-size:10px;color:var(--txt3);margin-top:2px">${nameStr}</div>
    </div>`;
  }).join('');
  ac.style.display = 'block';
}

function selectIqama(iqama) {
  document.getElementById('search-iqama').value = iqama;
  document.getElementById('ac-iqama').style.display = 'none';
  selectedIqama = iqama;
  // Resolve names in both apps
  resolvedNames = {};
  ['keeta','hunger','masar'].forEach(app => {
    selectedMonths.forEach(monthId => {
      const md = getDataForMonth(app, monthId);
      if (!md || !md.drivers) return;
      const d = md.drivers.find(x => x.iqama && String(x.iqama) === iqama);
      if (d && !resolvedNames[app]) resolvedNames[app] = d.name;
    });
  });
  const info = Object.entries(resolvedNames).map(([app,n])=>`${app==='keeta'?'🟡 كيتا':'🟠 هنقر'}: ${n}`).join(' | ');
  document.getElementById('sel-result').textContent = info || '';
}

function onSearchApp(val, app) {
  const acId = app === 'keeta' ? 'ac-keeta' : 'ac-hunger';
  const ac = document.getElementById(acId);
  const query = val.trim().toLowerCase();
  if (!query) { ac.style.display='none'; return; }

  const seen = new Map(); // key=name, val={name, iqama}
  selectedMonths.forEach(monthId => {
    const monthData = getDataForMonth(app, monthId);
    if (!monthData || !monthData.drivers) return;
    monthData.drivers.forEach(d => {
      const iqamaStr = d.iqama ? String(d.iqama) : '';
      const matchName = d.name.toLowerCase().includes(query);
      const matchIqama = iqamaStr.includes(query);
      if ((matchName || matchIqama) && !seen.has(d.name.toLowerCase())) {
        seen.set(d.name.toLowerCase(), {name: d.name, iqama: iqamaStr});
      }
    });
  });

  const results = [...seen.values()].slice(0,15);
  if (!results.length) { ac.style.display='none'; return; }
  ac.innerHTML = results.map(r =>
    `<div class="ac-item" onclick="selectAppDriver('${r.name.replace(/'/g,"\'")}','${app}')">
      <span>${r.name}</span>
      ${r.iqama ? `<span style="color:var(--txt3);font-size:10px;margin-right:8px">${r.iqama}</span>` : ''}
    </div>`
  ).join('');
  ac.style.display = 'block';
}

function selectAppDriver(name, app) {
  const acId = app === 'keeta' ? 'ac-keeta' : 'ac-hunger';
  const inputId = app === 'keeta' ? 'search-keeta' : 'search-hunger';
  const selId = app === 'keeta' ? 'sel-keeta' : 'sel-hunger';
  document.getElementById(inputId).value = name;
  document.getElementById(acId).style.display = 'none';
  document.getElementById(selId).textContent = '✓ ' + name;
  if (app === 'keeta') selectedKeetaName = name;
  else selectedHungerName = name;
}

function runReport() {
  const iqamaInput = document.getElementById('search-iqama').value.trim();
  if (!selectedIqama && iqamaInput.length >= 4) selectIqama(iqamaInput);
  const err = document.getElementById('run-error');
  if (!selectedIqama && !iqamaInput) {
    if (err) { err.textContent = '⚠️ أدخل رقم الإقامة أولاً'; err.style.display='block'; }
    return;
  }
  if (err) err.style.display='none';
  const kName = resolvedNames.keeta || null;
  const hName = resolvedNames.hunger || null;
  const mName = resolvedNames.masar || null;
  if (!kName && !hName && !mName) {
    if (err) { err.textContent = '❌ رقم الإقامة غير موجود في الأشهر المختارة'; err.style.display='block'; }
    return;
  }
  renderDualReport(kName, hName, mName);
}

function mapCity(city) { return cityMap[city] || city; }
function driverClassLocal(orders, city) {
  if (city==='Riyadh'||city==='الرياض') {
    if(orders>=550) return 'A'; if(orders>=420) return 'B'; if(orders>=300) return 'C'; return 'D';
  } else {
    if(orders>=600) return 'A'; if(orders>=500) return 'B'; if(orders>=400) return 'C'; return 'D';
  }
}
function mapVehicle(v) { return vehicleMap[v] || v || '—'; }

function statusClass(s) {
  if (!s) return '';
  if (s === 'صالح' || s === 'محقق') return 'status-s';
  if (s === 'ممكن') return 'status-m';
  if (s === 'صعب') return 'status-h';
  if (s === 'غير صالح') return 'status-n';
  return 'status-a';
}

function renderDualReport(keetaName, hungerName, masarName) {
  try {
  const rows = [];

  // For each selected month, check both apps
  const MONTH_LABELS = {'05-2026':'مايو 2026','06-2026':'يونيو 2026','07-2026':'يوليو 2026'};
  [...selectedMonths].sort().forEach(monthId => {
    const label = MONTH_LABELS[monthId] || monthId;
    [['keeta', keetaName, '#eab308', 'كيتا'], ['hunger', hungerName, '#f97316', 'هنقر'], ['masar', masarName, '#22d3ee', 'هنقر مسار']].forEach(([app, name, color, appLabel]) => {
      if (!name) return;
      const monthData = getDataForMonth(app, monthId);
      if (!monthData || !monthData.drivers) return;
      const nameLow = name.toLowerCase().trim();
      const iqamaQ = nameLow.replace(/\D/g,'');
    const d = monthData.drivers.find(x =>
      x.name.toLowerCase().trim() === nameLow ||
      (iqamaQ.length >= 8 && x.iqama && String(x.iqama) === iqamaQ)
    );
      if (!d) return;
      rows.push({monthId, label, app, appLabel, color, driver: d});
    });
  });
  
  const section = document.getElementById('result-section');
  if (rows.length === 0) {
    section.classList.remove('hidden');
    document.getElementById('driver-header').innerHTML = `<span class="driver-name">${keetaName||hungerName||masarName}</span>`;
    document.getElementById('result-body').innerHTML = `<tr><td colspan="16" class="empty-msg">لم يتم العثور على بيانات في الأشهر المحددة</td></tr>`;
    return;
  }
  
  // Build driver header info
  const appInfo = {};
  rows.forEach(r => {
    if (!appInfo[r.app]) appInfo[r.app] = {city: r.driver.city, vehicle: r.app === 'keeta' ? r.driver.type : r.driver.vehicle};
  });
  
  const driverName = rows.length ? rows[0].driver.name : (keetaName || hungerName || masarName);
  const iqamaDisplay = selectedIqama ? `<span style="font-size:13px;color:var(--txt3);margin-right:10px;font-weight:400">🪪 ${selectedIqama}</span>` : '';
  let headerHtml = `<span class="driver-name">${driverName}</span>${iqamaDisplay}`;

  
  document.getElementById('driver-header').innerHTML = headerHtml;
  
  // Build table rows
  const tbody = rows.map(r => {
    const d = r.driver;
    const isK = r.app === 'keeta';

    const status   = isK ? (d.probability||'—') : (d.status||'—');
    const city     = mapCity(d.city);
    const vehicle  = isK ? (d.type||'—') : mapVehicle(d.vehicle);
    // Keeta specific
    const faceId   = isK ? (d.face_id!=null?d.face_id+'%':'—') : '—';
    const avgKm    = isK ? (d.avg_km!=null?d.avg_km:'—') : (d.km&&d.completed?( d.km/d.completed).toFixed(1):'—');
    const cls      = isK ? (driverClassLocal(d.orders||0,d.city)||'—') : '—';
    // Hunger specific
    const rejected = !isK ? Math.max((d.planned||0)-(d.accepted||0),0) : '—';
    const hours    = !isK ? (d.hours!=null?d.hours.toFixed(1):'—') : '—';
    const accRate  = !isK ? (d.acceptance_rate!=null?d.acceptance_rate+'%':'—') : '—';
    const wknd     = !isK ? (d.wknd_absent||0) : '—';
    const wallet   = !isK ? (d.wallet!=null?d.wallet.toFixed(1):'—') : '—';
    
    const walletCls = (!isK&&d.wallet<0)?'color:#f87171':'';
    const wkndCls   = (!isK&&d.wknd_absent>0)?'color:#f87171':'';
    const faceCls   = (isK&&d.face_id!=null&&d.face_id<90)?'color:#f87171':'';
    
    return `<tr class="app-${r.app}">
      <td style="font-weight:700">${r.label}</td>
      <td style="color:${r.color};font-weight:700">${r.appLabel}</td>
      <td>${city}</td><td>${vehicle}</td>
      <td>${worked}</td><td>${valid}</td>
      <td style="font-weight:700;color:var(--acc2)">${orders.toLocaleString()}</td>

      <td>${hours}</td>

      <td style="${wkndCls}">${wknd}</td>

      <td>${avgKm}</td>
      <td style="${walletCls}">${wallet}</td>
      <td>${cls}</td>
      <td class="${statusClass(status)}">${status}</td>
    </tr>`;
  }).join('');
  
  document.getElementById('result-body').innerHTML = tbody;
  section.classList.remove('hidden');
  } catch(e) {
    console.error('[renderDualReport]', e);
    const err = document.getElementById('run-error');
    if (err) { err.textContent = '❌ خطأ: ' + e.message; err.style.display='block'; }
  }
}

function triggerRefresh() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '⏳ جاري التحديث...';

  const BASE = 'https://raw.githubusercontent.com/Asser1995/sahm/main/';
  const extract = html => {
    const m = html.match(/const MONTHS_DATA\s*=\s*(\{[\s\S]*?\});?\s*\n\s*(const|var|let|function|window|\/\/)/);
    return m ? m[1] : null;
  };

  Promise.all([
    fetch(BASE + 'keeta_dashboard.html?t=' + Date.now()).then(r => r.text()),
    fetch(BASE + 'hunger_dashboard_v2.html?t=' + Date.now()).then(r => r.text())
  ]).then(([kHtml, hHtml]) => {
    const kData = extract(kHtml);
    const hData = extract(hHtml);
    if (!kData || !hData) {
      alert('تعذّر استخراج البيانات');
      btn.disabled=false; btn.textContent='🔄 تحديث'; return;
    }
    try {
      Object.assign(KEETA_DATA,  (0,eval)('('+kData+')'));
      Object.assign(HUNGER_DATA, (0,eval)('('+hData+')'));
      buildMonthList();
      btn.textContent = '✅ تم التحديث';
      setTimeout(() => { btn.disabled=false; btn.textContent='🔄 تحديث'; }, 2000);
    } catch(e) {
      alert('خطأ: '+e.message);
      btn.disabled=false; btn.textContent='🔄 تحديث';
    }
  }).catch(e => {
    alert('تعذّر الاتصال بـ GitHub: ' + e.message);
    btn.disabled=false; btn.textContent='🔄 تحديث';
  });
}

function buildMonthList() {
  const AR_MONTHS = ['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const allKeys = new Set([...Object.keys(KEETA_DATA), ...Object.keys(HUNGER_DATA), ...Object.keys(MASAR_DATA)]);
  const sorted = [...allKeys].sort((a,b)=>{
    const [am,ay]=a.split('-').map(Number); const [bm,by]=b.split('-').map(Number);
    return ay!==by?ay-by:am-bm;
  });
  const grid = document.getElementById('months-grid');
  if (!grid) return;
  grid.innerHTML = '';
  selectedMonths.clear();
  sorted.forEach(mk => {
    const [m,y] = mk.split('-').map(Number);
    const lbl = AR_MONTHS[m]+' '+y;
    const label = document.createElement('label');
    label.style.cssText = 'display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:13px;user-select:none';
    label.innerHTML = `<input type="checkbox" value="${mk}" checked style="width:15px;height:15px;accent-color:#eab308;cursor:pointer"><span>${lbl}</span>`;
    label.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) selectedMonths.add(mk);
      else selectedMonths.delete(mk);
      updateMonthsLabel();
    });
    selectedMonths.add(mk);
    grid.appendChild(label);
  });
  updateMonthsLabel();
}
